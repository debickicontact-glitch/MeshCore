[Waveshare_S3_Zero_Core1262]

extends = esp32_base
board = esp32-s3-devkitc-1

board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

board_build.flash_size = 4MB
board_build.flash_mode = qio
board_build.partitions = default.csv

board_build.extra_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    
build_flags =
    ${esp32_base.build_flags}

    -D CORE_DEBUG_LEVEL=0

    -I variants/waveshare_s3_zero_core1262


    -D P_LORA_DIO_1=7
    -D P_LORA_NSS=10
    -D P_LORA_RESET=8
    -D P_LORA_BUSY=9

    -D P_LORA_SCLK=12
    -D P_LORA_MISO=13
    -D P_LORA_MOSI=11

    -D USE_SX1262
    -D RADIO_CLASS=CustomSX1262
    -D WRAPPER_CLASS=CustomSX1262Wrapper

    -D SX126X_RXEN=5
    -D SX126X_TXEN=6

    -D SX126X_DIO3_TCXO_VOLTAGE=1.8
    -D SX126X_CURRENT_LIMIT=140
    -D SX126X_RX_BOOSTED_GAIN=1

    -D LORA_TX_POWER=0

build_src_filter =
    ${esp32_base.build_src_filter}
    +<../variants/waveshare_s3_zero_core1262>
    +<helpers/sensors>


[env:Waveshare_S3_Zero_Core1262_companion_radio_ble]

extends = Waveshare_S3_Zero_Core1262

build_flags =
    ${Waveshare_S3_Zero_Core1262.build_flags}
    
    -D MAX_CONTACTS=350
    -D MAX_GROUP_CHANNELS=40
    -D BLE_PIN_CODE=123456
    -D BLE_DEBUG_LOGGING=1
    -D OFFLINE_QUEUE_SIZE=256

    ; Na czas pierwszych testow ograniczamy TX do 0 dBm.
    ; Po potwierdzeniu poprawnej pracy zwiekszymy moc.

    ; -D BLE_DEBUG_LOGGING=1
    ; -D MESH_PACKET_LOGGING=1
    ; -D MESH_DEBUG=1

build_src_filter =
    ${Waveshare_S3_Zero_Core1262.build_src_filter}
    -<../variants/waveshare_s3_zero_core1262/startup_test.cpp>
    +<../examples/companion_radio/*.cpp>
    +<helpers/esp32/*.cpp>

lib_deps =
    ${Waveshare_S3_Zero_Core1262.lib_deps}
    ${esp32_ota.lib_deps}
    densaugeo/base64 @ ~1.4.0


[env:Waveshare_S3_Zero_startup_test]

extends = esp32_base
board = esp32-s3-devkitc-1

; Waveshare ESP32-S3-Zero-M / ESP32-S3FH4R2
; 4 MB Flash + 2 MB OPI PSRAM

board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

board_build.flash_size = 4MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default.csv

board_build.extra_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
    ${esp32_base.build_flags}
    -D CORE_DEBUG_LEVEL=5

build_src_filter =
    -<*>
    +<../variants/waveshare_s3_zero_core1262/startup_test.cpp>

lib_deps =

[env:Waveshare_S3_Zero_Core1262_companion_radio_usb]
extends = Waveshare_S3_Zero_Core1262
build_flags =
    ${Waveshare_S3_Zero_Core1262.build_flags}
    -D MAX_CONTACTS=350
    -D MAX_GROUP_CHANNELS=40
    -D ENABLE_USB_INTERFACE=1
    -D OFFLINE_QUEUE_SIZE=256
build_src_filter =
    ${Waveshare_S3_Zero_Core1262.build_src_filter}
    -<../variants/waveshare_s3_zero_core1262/startup_test.cpp>
    +<../examples/companion_radio/*.cpp>
    +<helpers/esp32/*.cpp>
lib_deps =
    ${Waveshare_S3_Zero_Core1262.lib_deps}
    ${esp32_ota.lib_deps}
    densaugeo/base64 @ ~1.4.0
